<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" 
    rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <title>Laili WeatherCheck APP</title>
</head>
<body>
    <div class="weather-app">
    <header>
    <form class="search-form" id="search-form">
        <input type="search" placeholder="Please Enter a city..." required 
        id="search-form-input" class="search-form-input"/>
        <input type="submit" value="search" class="search-form-button"/>
    </form>
   </header> 
   <main>
    <div class="weather-app-data">
    <div>
        <h1 id="city" class="weather-app-city"></h1>
        <strong class="weather-app-details">
        <span id="time"></span>, <span id="description"></span>
        <br/>
        Humidity: <strong id="humidity"></strong>, Wind: <strong id="wind-speed"></strong>
       </p>
    </div>
     <div class="weather-app-temperature-container">
        <div id="icon"></div>
        <div class="weather-app-temperature" id="temperature"></div>
        <div class="weather-app-unit">°C</div>
    </div>
    </div>
   </main> 
   <footer>
    This project was coded by 
    <a href="https://github.com/LailiNemati" target="_blank">Laili Nemati</a> 
    is 
    <a href="https://github.com/LailiNemati/Weather-Webpage" target="_blank">open-sourced on GitHub</a>
    and
    <a href="" target="_blank">hosted on Netlify</a>
   </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
